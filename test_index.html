<script id="ltx-sort-script">
window.addEventListener("load", function() {
  if (document.getElementById("ltx-sort-bar")) return;
  const allBtn = Array.from(document.querySelectorAll("button")).find(b => b.textContent && b.textContent.trim() === "全部");
  const dp = allBtn || Array.from(document.querySelectorAll("button")).find(b => b.textContent && b.textContent.includes("unknown date"));
  if (!dp) return;

  const uPill = Array.from(document.querySelectorAll("button")).find(b => b.textContent && b.textContent.includes("unknown date"));
  if (uPill && uPill.parentElement) uPill.parentElement.appendChild(uPill);

  const bar = document.createElement("div");
  bar.id = "ltx-sort-bar";
  bar.innerHTML = '<button class="active" data-m="date-desc">日期(倒序)</button><button data-m="date-asc">日期(順序)</button><button data-m="name-asc">名字(A-Z)</button><button data-m="name-desc">名字(Z-A)</button><button data-m="code-asc">番號(A-Z)</button><button data-m="code-desc">番號(Z-A)</button><button id="ltxRnd" data-m="random">隨機</button><button id="ltx-fav-bak-btn">💾 收藏備份</button>';
  if (dp.parentElement && dp.parentElement.parentElement) dp.parentElement.parentElement.appendChild(bar);
  else dp.parentElement.insertAdjacentElement("afterend", bar);

  let masterBackup = null;

  const parseT = (t) => {
    let act = "", cd = ""; const d = t.indexOf("·");
    if (d >= 0) {
      const r = t.substring(d + 1).trim();
      const op = r.lastIndexOf("("), cp = r.lastIndexOf(")");
      if (op > 0 && cp > op) { act = r.substring(0, op).trim(); cd = r.substring(op + 1, cp).trim().toUpperCase(); }
      else { act = r; }
    }
    return { act: act, cd: cd };
  };

  function getTargetArray() {
    if (typeof GIF_DATA !== "undefined" && Array.isArray(GIF_DATA)) return GIF_DATA;
    if (typeof allData !== "undefined" && Array.isArray(allData)) return allData;
    if (typeof DATA !== "undefined" && Array.isArray(DATA)) return DATA;
    return null;
  }

  bar.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", function() {
      const arr = getTargetArray();
      if (!arr) return;
      if (!masterBackup) {
        arr.forEach((it, idx) => { it._oi = idx; });
        masterBackup = arr.slice();
      }

      bar.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const m = btn.dataset.m;
      const rnd = document.getElementById("ltxRnd");

      let sorted = [];
      if (m === "random") {
        let seen = new Set(JSON.parse(localStorage.getItem("ltx_pure_deck_v11") || "[]"));
        let un = masterBackup.filter(it => !seen.has(it.url));
        if (un.length === 0) { seen.clear(); un = masterBackup.slice(); }
        for (let i = un.length - 1; i > 0; i--) {
          const b = new Uint32Array(1); window.crypto.getRandomValues(b);
          const j = b.at(0) % (i + 1);
          const tmp = un.at(i); un.splice(i, 1, un.at(j)); un.splice(j, 1, tmp);
        }
        const picked = un.slice(0, 16);
        picked.forEach(it => seen.add(it.url));
        localStorage.setItem("ltx_pure_deck_v11", JSON.stringify(Array.from(seen)));
        if (rnd) rnd.textContent = "隨機 (" + Math.max(0, un.length - picked.length) + "/" + masterBackup.length + ")";
        const pickedSet = new Set(picked.map(x => x.url));
        const rest = masterBackup.filter(x => !pickedSet.has(x.url));
        sorted = picked.concat(rest);
      } else {
        if (rnd) rnd.textContent = "隨機";
        sorted = masterBackup.slice().sort((ia, ib) => {
          const pa = parseT(String(ia.title || "")), pb = parseT(String(ib.title || ""));
          if (m === "date-desc") return (ib.date === "unknown date" ? "0000" : ib.date).localeCompare(ia.date === "unknown date" ? "0000" : ia.date) || ia._oi - ib._oi;
          if (m === "date-asc") return (ia.date === "unknown date" ? "0000" : ia.date).localeCompare(ib.date === "unknown date" ? "0000" : ib.date) || ib._oi - ia._oi;
          if (m === "name-asc" || m === "name-desc") { if (!pa.act && !pb.act) return ia._oi - ib._oi; if (!pa.act) return 1; if (!pb.act) return -1; const ea = (pa.act.match(/[A-Za-z][A-Za-z\s.'-]+/) || [""])[0].trim(), eb = (pb.act.match(/[A-Za-z][A-Za-z\s.'-]+/) || [""])[0].trim(); const c = (ea && eb) ? ea.localeCompare(eb, "en", { sensitivity: "base" }) : (ea ? -1 : (eb ? 1 : pa.act.localeCompare(pb.act, "ja"))); return m === "name-asc" ? c : -c; }
          if (m === "code-asc" || m === "code-desc") { if (!pa.cd && !pb.cd) return ia._oi - ib._oi; if (!pa.cd) return 1; if (!pb.cd) return -1; const c = pa.cd.localeCompare(pb.cd, "en", { numeric: true }); return m === "code-asc" ? c : -c; }
          return ia._oi - ib._oi;
        });
      }

      arr.length = 0;
      sorted.forEach(item => arr.push(item));
      if (allBtn) allBtn.click();
      btn.classList.add("active");
    });
  });
});
</script>

<script id="ltx-lb-jump">
window.addEventListener("load", function() {
  const bar = document.createElement("div");
  bar.id = "ltx-lb-jump-bar";
  bar.style.cssText = "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10001;display:none;gap:8px;align-items:center;background:rgba(15,23,42,0.88);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.18);";
  document.body.appendChild(bar);

  function parseMeta(txt) {
    let act = "", code = "";
    const d = txt.indexOf("·");
    if (d >= 0) {
      const r = txt.substring(d + 1).trim();
      const op = r.lastIndexOf("("), cp = r.lastIndexOf(")");
      if (op > 0 && cp > op) { act = r.substring(0, op).trim(); code = r.substring(op + 1, cp).trim(); }
      else { act = r; }
    }
    return { act: act, code: code };
  }

  function syncJumpBar() {
    const lb = document.querySelector("#lb, .lb, .lightbox, [id*='lightbox']");
    const isOpen = lb && (lb.style.display === "flex" || lb.style.display === "block" || lb.classList.contains("open") || lb.classList.contains("active") || (lb.offsetParent !== null && lb.offsetHeight > 200));
    if (!isOpen) { bar.style.display = "none"; return; }

    const capEl = lb.querySelector(".lb-cap, .cap, #lb-cap, [id*='cap'], p, span");
    const txt = capEl ? capEl.textContent.trim() : "";
    const meta = parseMeta(txt);
    if (!meta.code && !meta.act) { bar.style.display = "none"; return; }

    let btns = "";
    const btnCss = "color:#e2e8f0;text-decoration:none;font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);white-space:nowrap;";
    if (meta.code) btns += '<a href="list.html?q=' + encodeURIComponent(meta.code) + '" target="_blank" style="' + btnCss + '">🎬 ' + meta.code + '</a>';
    if (meta.act) btns += '<a href="list.html?q=' + encodeURIComponent(meta.act) + '" target="_blank" style="' + btnCss + '">👩 ' + meta.act + '</a>';
    bar.innerHTML = btns;
    bar.style.display = "flex";
  }

  document.addEventListener("click", function() { setTimeout(syncJumpBar, 60); });
  document.addEventListener("keyup", function() { setTimeout(syncJumpBar, 60); });
});
</script>
