  topPub.forEach(function(pub){
    var b=document.createElement("button"); b.className="chip"; b.textContent="🏢 "+pub+" ("+pubCnt[pub]+")";
    b.onclick=function(){ filterByText(pub); }; bar.appendChild(b);
  });
}

var qInput=document.getElementById("q"), clrBtn=document.getElementById("btnClear");
qInput.oninput=function(){ clrBtn.classList.toggle("show", !!this.value); runFilter(); };
clrBtn.onclick=function(){ qInput.value=""; this.classList.remove("show"); runFilter(); };
function filterByText(t){ qInput.value=t; clrBtn.classList.add("show"); runFilter(); window.scrollTo({top:0,behavior:"smooth"}); }

document.getElementById("btnPw").onclick=function(){ var b=this; if(navigator.clipboard)navigator.clipboard.writeText("ltxxx").then(function(){ b.textContent="✅ 已複製"; setTimeout(function(){ b.textContent="🔑 ltxxx"; },1200); }); };
document.getElementById("btnAll").onclick=function(){ only4k=false; onlyFav=false; syncFilterBtns(); runFilter(); };
document.getElementById("btn4k").onclick=function(){ only4k=!only4k; if(only4k)onlyFav=false; syncFilterBtns(); runFilter(); };
document.getElementById("btnFav").onclick=function(){ onlyFav=!onlyFav; if(onlyFav)only4k=false; syncFilterBtns(); runFilter(); };
document.getElementById("sortSel").onchange=function(){ sortBy=this.value; runFilter(); };
document.getElementById("btnView").onclick=function(){
  listView=!listView;
  document.getElementById("grid").classList.toggle("list-view", listView);
  this.textContent = listView ? "⊞ 卡片" : "☰ 清單";
};
function syncFilterBtns(){
  document.getElementById("btnAll").classList.toggle("active", !only4k && !onlyFav);
  document.getElementById("btn4k").classList.toggle("active", only4k);
  document.getElementById("btnFav").classList.toggle("active", onlyFav);
}

var topBtn=document.getElementById("btnTop");
window.addEventListener("scroll",function(){ if(window.scrollY>400)topBtn.classList.add("show"); else topBtn.classList.remove("show"); },{passive:true});
topBtn.onclick=function(){ window.scrollTo({top:0,behavior:"smooth"}); };

document.getElementById("grid").onclick=function(e){
  var t=e.target;
  if(t.classList.contains("code") && navigator.clipboard){
    var v=t.getAttribute("data-val");
    navigator.clipboard.writeText(v).then(function(){ t.textContent="✅ 已複製"; setTimeout(function(){ t.textContent=v; },1000); });
  } else if(t.classList.contains("actress") || t.classList.contains("pub")){
    filterByText(t.getAttribute("data-val"));
} else if(t.classList.contains("fav-act")){
var fn=t.getAttribute("data-fn");
if(favs[fn]) delete favs[fn]; else favs[fn]=1;
saveFavs();
var on=!!favs[fn]; t.classList.toggle("faved", on); t.textContent=on?"❤️":"🤍";
if(onlyFav && !on) runFilter();
}
};
function runFilter(){
var kw=(qInput.value||"").trim().toLowerCase();
curList=LIST.filter(function(x){
if(only4k && !x.k) return false;
if(onlyFav && !favs[x.f]) return false;
if(kw && (x.c+" "+x.a+" "+x.t+" "+x.p+" "+x.d).toLowerCase().indexOf(kw)===-1) return false;
return true;
});
if(sortBy==="gb_desc") curList.sort(function(a,b){ return (b.g||0)-(a.g||0); });
else if(sortBy==="code") curList.sort(function(a,b){ return (a.c||a.f).localeCompare(b.c||b.f); });
var tot=curList.reduce(function(s,x){ return s+(x.g||0); },0);
document.getElementById("statTxt").textContent="顯示 "+curList.length+" 部影片（共 "+tot.toFixed(1)+" GB）";
rendered=0; document.getElementById("grid").innerHTML=""; appendCards();
}
function appendCards(){
var g=document.getElementById("grid"), end=Math.min(rendered+STEP, curList.length);
for(var i=rendered; i<end; i++){
var x=curList[i], c=document.createElement("div");
c.className="card"+(x.k?" is4k":"");
var top=document.createElement("div"); top.className="c-top";
if(x.c){ var s1=document.createElement("span"); s1.className="code"; s1.setAttribute("data-val",x.c); s1.textContent=x.c; top.appendChild(s1); }
if(x.k){ var s2=document.createElement("span"); s2.className="tag-4k"; s2.textContent="4K"; top.appendChild(s2); }
if(x.a){ var s3=document.createElement("span"); s3.className="actress"; s3.setAttribute("data-val",x.a); s3.textContent=x.a; top.appendChild(s3); }
if(x.p){ var s4=document.createElement("span"); s4.className="pub"; s4.setAttribute("data-val",x.p); s4.textContent=x.p; top.appendChild(s4); }
var tit=document.createElement("div"); tit.className="title"; tit.textContent=x.t;
var bot=document.createElement("div"); bot.className="c-bot";
var meta=document.createElement("div"); meta.className="meta-tags";
var b1=document.createElement("span"); b1.className="badge"; b1.textContent="📦 "+x.g+" GB";
var b2=document.createElement("span"); b2.className="badge"; b2.textContent="📅 "+x.u;
meta.appendChild(b1); meta.appendChild(b2);
var act=document.createElement("div"); act.className="actions";
var favBtn=document.createElement("button");
var isOn=!!favs[x.f];
favBtn.className="mini-btn fav-act"+(isOn?" faved":"");
favBtn.setAttribute("data-fn", x.f);
favBtn.textContent=isOn?"❤️":"🤍";
favBtn.title="加入待看清單";
act.appendChild(favBtn);
if(x.c){
var imgSearch=document.createElement("a");
imgSearch.className="mini-btn";
imgSearch.href="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(x.c+" "+x.a);
imgSearch.target="_blank";
imgSearch.textContent="🖼️ 預覽";
imgSearch.title="搜尋封面劇照";
act.appendChild(imgSearch);
}
var lnk=document.createElement("a");
lnk.className="open-btn";
lnk.href=x.l;
lnk.target="_blank";
lnk.title=x.d;
lnk.textContent="📂 "+x.d;
act.appendChild(lnk);
bot.appendChild(meta); bot.appendChild(act);
c.appendChild(top); c.appendChild(tit); c.appendChild(bot);
g.appendChild(c);
}
rendered=end;
}
new IntersectionObserver(function(es){ if(es.isIntersecting)appendCards(); },{rootMargin:"500px"}).observe(document.getElementById("more"));
initHotChips(); saveFavs(); runFilter();
</script></body></html>
