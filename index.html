<style id="ltx-sort-style">
  #ltx-sort-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin: 0 0 10px 0;
    padding: 7px 14px;
    background: rgba(17, 17, 21, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-sizing: border-box;
    width: 100%;
  }
  #ltx-sort-bar.is-fixed {
    position: fixed;
    left: 0;
    right: 0;
    z-index: 9500;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
  }
  #ltx-sort-bar button.sort-btn {
    background: rgba(255, 255, 255, 0.07);
    color: #9ca3af;
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 3px 11px;
    height: 26px;
    line-height: 18px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  #ltx-sort-bar button.sort-btn:hover {
    background: rgba(255, 255, 255, 0.16);
    color: #f3f4f6;
  }
  #ltx-sort-bar button.sort-btn.active {
    background: #10b981;
    color: #ffffff;
    border-color: #10b981;
    font-weight: 600;
  }
  #ltx-copy-toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #10b981;
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 99999;
  }
  #ltx-copy-toast.show { opacity: 1; }
  .ltx-code-chip {
    cursor: pointer;
    border-bottom: 1px dashed rgba(16, 185, 129, 0.6);
    transition: color 0.15s ease;
  }
  .ltx-code-chip:hover { color: #10b981; }
</style>
<script id="ltx-sort-script">
document.addEventListener("DOMContentLoaded", function() {
  if (document.getElementById("ltx-sort-bar")) return;

  const dataEl = document.getElementById("gif-data");
  const isGifWall = !!dataEl;
  const urlMetaMap = new Map();

  if (isGifWall) {
    let allItems = [];
    try { allItems = JSON.parse(dataEl.textContent || "[]"); } catch(e) {}
    if (Array.isArray(allItems)) {
      allItems.forEach((it, idx) => {
        const rawT = String(it.title || "");
        let actress = "", code = "";
        const dotPos = rawT.indexOf("·");
        if (dotPos >= 0) {
          const rest = rawT.substring(dotPos + 1).trim();
          const openP = rest.lastIndexOf("("), closeP = rest.lastIndexOf(")");
          if (openP > 0 && closeP > openP) {
            actress = rest.substring(0, openP).trim();
            code = rest.substring(openP + 1, closeP).trim().toUpperCase();
          } else {
            actress = rest;
          }
        }
        urlMetaMap.set(String(it.url || "").trim(), { idx: idx, date: String(it.date || ""), actress: actress, code: code });
      });
    }
  }

  function showToast(msg) {
    let toast = document.getElementById("ltx-copy-toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "ltx-copy-toast";
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove("show"), 1600);
  }

  function findGifGrid() {
    const imgs = Array.from(document.querySelectorAll("img")).filter(im => urlMetaMap.has(im.getAttribute("src") || "") || urlMetaMap.has(im.src || ""));
    if (imgs.length < 2) return null;
    let p1 = imgs.at(0).parentElement, p2 = imgs.at(1).parentElement;
    while (p1 && p2 && p1.parentElement !== p2.parentElement) { p1 = p1.parentElement; p2 = p2.parentElement; }
    return p1 ? p1.parentElement : null;
  }

  function cryptoRandomInt(max) {
    if (window.crypto && window.crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf.at(0) % max;
    }
    return Math.floor(Math.random() * max);
  }

  function cryptoShuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = cryptoRandomInt(i + 1);
      const tmp = arr.at(i);
      arr.splice(i, 1, arr.at(j));
      arr.splice(j, 1, tmp);
    }
    return arr;
  }

  function strictExhaustiveShuffle(items, getKeyFn, storageKey) {
    let seenSet = new Set();
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
      if (Array.isArray(saved)) saved.forEach(k => seenSet.add(String(k)));
    } catch(e) {}

    let unseen = [], seen = [];
    items.forEach(el => {
      const k = getKeyFn(el);
      if (seenSet.has(k)) seen.push(el);
      else unseen.push(el);
    });

    if (unseen.length === 0) {
      seenSet.clear();
      unseen = items.slice();
      seen = [];
      showToast("🔄 全庫已完整輪播一輪，開啟全新隨機循環！");
    }

    cryptoShuffle(unseen);
    cryptoShuffle(seen);

    const markCount = Math.min(60, unseen.length);
    for (let i = 0; i < markCount; i++) {
      seenSet.add(getKeyFn(unseen.at(i)));
    }

    try { localStorage.setItem(storageKey, JSON.stringify(Array.from(seenSet))); } catch(e) {}
    return unseen.concat(seen);
  }

  let currentSortMode = "date-desc";
  let isApplyingSort = false;

  function applySort(mode, forceReshuffle) {
    if (isApplyingSort) return;
    isApplyingSort = true;
    currentSortMode = mode;

    try {
      if (isGifWall) {
        const grid = findGifGrid();
        if (!grid) return;
        const cards = Array.from(grid.children);
        if (mode === "random") {
          if (forceReshuffle) {
            const ordered = strictExhaustiveShuffle(cards, (c) => {
              const im = c.querySelector("img");
              return im ? (im.getAttribute("src") || im.src || "") : String(Math.random());
            }, "ltx_gif_strict_seen_v2");
            ordered.forEach(c => grid.appendChild(c));
          }
          return;
        }
        const getInfo = (card) => {
          const im = card.querySelector("img");
          if (!im) return { idx: 9999, date: "", actress: "", code: "" };
          return urlMetaMap.get(im.getAttribute("src") || "") || urlMetaMap.get(im.src || "") || { idx: 9999, date: "", actress: "", code: "" };
        };
        cards.sort((a, b) => {
          const ma = getInfo(a), mb = getInfo(b);
          if (mode === "date-desc") {
            const da = ma.date === "unknown date" ? "0000-00-00" : ma.date;
            const db = mb.date === "unknown date" ? "0000-00-00" : mb.date;
            return db !== da ? db.localeCompare(da) : ma.idx - mb.idx;
          }
          if (mode === "date-asc") {
            const da = ma.date === "unknown date" ? "9999-99-99" : ma.date;
            const db = mb.date === "unknown date" ? "9999-99-99" : mb.date;
            return da !== db ? da.localeCompare(db) : mb.idx - ma.idx;
          }
          if (mode === "name-asc" || mode === "name-desc") {
            if (!ma.actress && !mb.actress) return ma.idx - mb.idx;
            if (!ma.actress) return 1;
            if (!mb.actress) return -1;
            const cmp = ma.actress.localeCompare(mb.actress, "ja");
            return mode === "name-asc" ? cmp : -cmp;
          }
          if (mode === "code-asc" || mode === "code-desc") {
            if (!ma.code && !mb.code) return ma.idx - mb.idx;
            if (!ma.code) return 1;
            if (!mb.code) return -1;
            const cmp = ma.code.localeCompare(mb.code, "en", { numeric: true });
            return mode === "code-asc" ? cmp : -cmp;
          }
          return ma.idx - mb.idx;
        });
        cards.forEach(c => grid.appendChild(c));
      } else {
        const tbody = document.querySelector("table tbody");
        if (!tbody) return;
        const rows = Array.from(tbody.querySelectorAll("tr"));
        if (rows.length === 0) return;

        rows.forEach((tr, i) => { if (!tr.dataset.origIdx) tr.dataset.origIdx = String(i); });

        if (mode === "random") {
          if (forceReshuffle) {
            const orderedRows = strictExhaustiveShuffle(rows, (r) => r.dataset.origIdx || r.textContent.slice(0, 40), "ltx_list_strict_seen_v2");
            orderedRows.forEach(r => tbody.appendChild(r));
          }
          return;
        }

        const parseRow = (tr) => {
          const cells = Array.from(tr.querySelectorAll("td"));
          const txtAll = cells.map(c => c.textContent.trim()).join(" ");
          let dateVal = "", codeVal = "", nameVal = "";
          const dm = txtAll.match(/(\d{2,4}-\d{1,2}-\d{1,2})/);
          if (dm) dateVal = dm.at(1);
          const cm = txtAll.match(/([A-Za-z]{2,6}-\d{2,5})/);
          if (cm) codeVal = cm.at(1).toUpperCase();
          for (const c of cells) {
            const t = c.textContent.trim();
            if (t && t !== "-" && !t.match(/^\d/) && !t.match(/^[A-Za-z]{2,6}-\d/) && !t.includes("GB") && !t.includes("MB") && !t.includes("PikPak") && !t.includes("開啟")) {
              nameVal = t.replace(/\s+\d{2}-\d{1,2}-\d{1,2}$/, "").trim();
              break;
            }
          }
          return { orig: Number(tr.dataset.origIdx || 0), date: dateVal, code: codeVal, name: nameVal };
        };

        rows.sort((a, b) => {
          const ra = parseRow(a), rb = parseRow(b);
          if (mode === "date-desc") return rb.date !== ra.date ? rb.date.localeCompare(ra.date) : ra.orig - rb.orig;
          if (mode === "date-asc") {
            const da = ra.date || "99-99-99", db = rb.date || "99-99-99";
            return da !== db ? da.localeCompare(db) : rb.orig - ra.orig;
          }
          if (mode === "name-asc" || mode === "name-desc") {
            if (!ra.name && !rb.name) return ra.orig - rb.orig;
            if (!ra.name) return 1;
            if (!rb.name) return -1;
const cmp = ra.name.localeCompare(rb.name, "ja");
return mode === "name-asc" ? cmp : -cmp;
}
if (mode === "code-asc" || mode === "code-desc") {
if (!ra.code && !rb.code) return ra.orig - ra.orig;
if (!ra.code) return 1;
if (!rb.code) return -1;
const cmp = ra.code.localeCompare(rb.code, "en", { numeric: true });
return mode === "code-asc" ? cmp : -cmp;
}
return ra.orig - rb.orig;
});
rows.forEach(r => tbody.appendChild(r));
}
} finally {
setTimeout(() => { isApplyingSort = false; }, 30);
}
}
const spacer = document.createElement("div");
spacer.id = "ltx-sort-spacer";
spacer.style.display = "none";
const bar = document.createElement("div");
bar.id = "ltx-sort-bar";
bar.innerHTML =
'日期(倒序)' +
'日期(順序)' +
'名字(A-Z)' +
'名字(Z-A)' +
'番號(A-Z)' +
'番號(Z-A)' +
'隨機';
const anchor = isGifWall ? findGifGrid() : document.querySelector("table");
if (anchor && anchor.parentElement) {
anchor.parentElement.insertBefore(spacer, anchor);
anchor.parentElement.insertBefore(bar, anchor);
} else {
document.body.insertBefore(spacer, document.body.firstChild);
document.body.insertBefore(bar, document.body.firstChild);
}
function detectTopHeaderHeight() {
let maxBottom = 0;
document.querySelectorAll("header, nav, .header, .top-bar, .sticky, [style*='sticky'], [style*='fixed']").forEach(el => {
if (el.id === "ltx-sort-bar" || el.id === "ltx-copy-toast") return;
const st = window.getComputedStyle(el);
if ((st.position === "fixed" || st.position === "sticky") && st.display !== "none") {
const r = el.getBoundingClientRect();
if (r.top <= 5 && r.height > 0 && r.height < 160 && r.bottom > maxBottom) {
maxBottom = r.bottom;
}
}
});
return Math.round(maxBottom);
}
function updateFixedBar() {
const topOffset = detectTopHeaderHeight();
const refEl = bar.classList.contains("is-fixed") ? spacer : bar;
const rect = refEl.getBoundingClientRect();
if (rect.top <= topOffset) {
if (!bar.classList.contains("is-fixed")) {
spacer.style.height = bar.offsetHeight + "px";
spacer.style.display = "block";
bar.classList.add("is-fixed");
}
bar.style.top = topOffset + "px";
} else {
if (bar.classList.contains("is-fixed")) {
bar.classList.remove("is-fixed");
bar.style.top = "";
spacer.style.display = "none";
}
}
}
window.addEventListener("scroll", updateFixedBar, { passive: true });
window.addEventListener("resize", updateFixedBar, { passive: true });
bar.querySelectorAll(".sort-btn").forEach(btn => {
btn.addEventListener("click", () => {
bar.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
btn.classList.add("active");
applySort(btn.dataset.mode, true);
});
});
const targetContainer = isGifWall ? findGifGrid() : document.querySelector("table tbody");
if (targetContainer) {
const filterObs = new MutationObserver(() => {
if (!isApplyingSort && currentSortMode !== "date-desc") {
applySort(currentSortMode, false);
}
});
filterObs.observe(targetContainer, { childList: true });
}
document.querySelectorAll("input, select").forEach(el => {
el.addEventListener("input", () => setTimeout(() => applySort(currentSortMode, false), 60));
el.addEventListener("change", () => setTimeout(() => applySort(currentSortMode, false), 60));
});
if (!isGifWall) {
document.querySelectorAll("table tbody td").forEach(td => {
const txt = td.textContent.trim();
if (txt.match(/^[A-Za-z]{2,6}-\d{2,5}$/)) {
td.classList.add("ltx-code-chip");
td.title = "點擊複製番號 " + txt;
td.addEventListener("click", (e) => {
e.stopPropagation();
navigator.clipboard.writeText(txt).then(() => showToast("📋 已複製番號：" + txt)).catch(() => {});
});
}
});
}
if (isGifWall) {
function stepLightbox(delta) {
const lb = document.getElementById("lightbox") || document.querySelector(".lightbox");
if (!lb) return;
const lbStyle = window.getComputedStyle(lb);
if (lbStyle.display === "none" || lbStyle.visibility === "hidden" || lb.classList.contains("hidden")) return;
const lbImg = lb.querySelector("img");
if (!lbImg) return;
const curSrc = lbImg.getAttribute("src") || lbImg.src || "";
const grid = findGifGrid();
if (!grid) return;
const visibleCards = Array.from(grid.children).filter(c => window.getComputedStyle(c).display !== "none");
if (visibleCards.length < 2) return;
let curIdx = -1;
for (let i = 0; i < visibleCards.length; i++) {
const im = visibleCards.at(i).querySelector("img");
if (im && ((im.getAttribute("src") || "") === curSrc || im.src === curSrc)) {
curIdx = i;
break;
}
}
if (curIdx < 0) return;
const nextIdx = (curIdx + delta + visibleCards.length) % visibleCards.length;
const nextCard = visibleCards.at(nextIdx);
const clickTarget = nextCard.querySelector("img") || nextCard;
clickTarget.click();
}
document.addEventListener("keydown", (e) => {
if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
if (e.key === "ArrowRight") stepLightbox(1);
else if (e.key === "ArrowLeft") stepLightbox(-1);
});
let touchStartX = 0;
document.addEventListener("touchstart", (e) => {
if (e.changedTouches && e.changedTouches.length > 0) touchStartX = e.changedTouches.item(0).screenX;
}, { passive: true });
document.addEventListener("touchend", (e) => {
if (!touchStartX || !e.changedTouches || e.changedTouches.length === 0) return;
const diffX = e.changedTouches.item(0).screenX - touchStartX;
touchStartX = 0;
if (Math.abs(diffX) > 55) stepLightbox(diffX < 0 ? 1 : -1);
}, { passive: true });
}
});
