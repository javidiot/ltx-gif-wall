<script>
var DATA = JSON.parse(document.getElementById('gif-data').textContent);

var FAV_KEY='ltx_gif_favs_v1',favMap={};try{favMap=JSON.parse(localStorage.getItem(FAV_KEY)||'{}')||{};}catch(e){favMap={};}
function saveFavs(){try{localStorage.setItem(FAV_KEY,JSON.stringify(favMap));}catch(e){}updateFavCountUI();}function isFaved(u){return !!favMap[u];}function toggleFav(u){if(!u)return;if(favMap[u])delete favMap[u];else favMap[u]=1;saveFavs();}function updateFavCountUI(){var c=0;for(var i=0;i<DATA.length;i++)if(favMap[DATA[i].url])c++;document.getElementById("btnFavs").textContent="❤️ 收藏 ("+c+")";}
function fastUrl(u){ return u; }
function initFilters(){
  var seen={},dates=[];
  for(var i=0;i<DATA.length;i++){var d=DATA[i].date;if(d){if(!seen[d]){seen[d]=0;dates.push(d);}seen[d]++;}}
  dates.sort().reverse();recentDates=dates.slice(0,3);
  var sel=document.getElementById("dateSel"),cb=document.getElementById("chipBar");
  for(var j=0;j<dates.length;j++){

    var opt=document.createElement("option");opt.value=ds;opt.textContent=lb+" 張";sel.appendChild(opt);
    if(j<12){(function(td,cl){var ch=document.createElement("button");ch.className="chip";ch.setAttribute("data-date",td);ch.textContent=cl;ch.onclick=function(){if(filterMode==="date"&&curDate===td)setFilterUI("all","");else setFilterUI("date",td);};cb.appendChild(ch);})(ds,lb);}
  }
  document.getElementById("btnCopyPw").textContent="🔑 ltxxx ("+DATA.length+")";updateFavCountUI();
}
function setFilterUI(m,dv){
  filterMode=m;curDate=dv||"";
  document.getElementById("btnAll").className="pill"+(m==="all"?" active":"");
  document.getElementById("btnRecent").className="pill"+(m==="recent"?" active":"");
  document.getElementById("btnFavs").className="pill fav-pill"+(m==="favs"?" active":"");
  document.getElementById("dateSel").value=(m==="date")?curDate:"";
  var cs=document.querySelectorAll(".chip");for(var i=0;i<cs.length;i++)cs[i].className="chip"+(m==="date"&&cs[i].getAttribute("data-date")===curDate?" active":"");
  resetAndRender();
}
document.getElementById("btnAll").onclick=function(){setFilterUI("all","");};
document.getElementById("btnRecent").onclick=function(){setFilterUI("recent","");};
document.getElementById("btnFavs").onclick=function(){setFilterUI("favs","");};
document.getElementById("dateSel").onchange=function(){if(this.value)setFilterUI("date",this.value);else setFilterUI("all","");};
document.getElementById("kw").oninput=function(){resetAndRender();};
document.getElementById("btnCopyPw").onclick=function(){var b=this;if(navigator.clipboard)navigator.clipboard.writeText("ltxxx").then(function(){var o=b.textContent;b.textContent="✅ 已複製 ltxxx";setTimeout(function(){b.textContent=o;},1500);});};
document.getElementById("btnShuffle").onclick=function(){for(var i=DATA.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=DATA[i];DATA[i]=DATA[j];DATA[j]=t;}resetAndRender();};
document.getElementById("btnCols").onclick=function(){var w=document.getElementById("wall");colMode=(colMode+1)%4;w.className="masonry"+(colMode===1?" cols-1":colMode===2?" cols-2":colMode===3?" cols-5":"");};
var topBtn=document.getElementById("btnTop");window.addEventListener("scroll",function(){if(window.scrollY>400)topBtn.classList.add("show");else topBtn.classList.remove("show");},{passive:true});topBtn.onclick=function(){window.scrollTo({top:0,behavior:"smooth"});};
function stopAutoPlay(){if(playTimer){clearInterval(playTimer);playTimer=null;}var b=document.getElementById("btnAutoPlay");if(b){b.className="lb-btn";b.textContent="▶️ 自動輪播";}}
document.getElementById("btnAutoPlay").onclick=function(e){e.stopPropagation();if(playTimer)stopAutoPlay();else{this.className="lb-btn playing";this.textContent="⏸️ 輪播中 (4s)";playTimer=setInterval(function(){curIdx++;showLb();},4000);}};
function syncLbFav(u){var b=document.getElementById("btnLbFav");if(isFaved(u)){b.className="lb-btn faved";b.textContent="❤️ 已收藏";}else{b.className="lb-btn";b.textContent="🤍 收藏";}}
document.getElementById("btnLbFav").onclick=function(e){e.stopPropagation();var l=window._curList;if(!l||!l.length)return;var it=l[curIdx];toggleFav(it.url);syncLbFav(it.url);resetAndRender();};
function closeLb(){stopAutoPlay();document.getElementById("lb").classList.remove("show");}
function openLb(idx){curIdx=idx;showLb();}
function showLb(){var l=window._curList;if(!l||!l.length)return;if(curIdx<0)curIdx=l.length-1;if(curIdx>=l.length)curIdx=0;var it=l[curIdx];var lbImg=document.getElementById("lb-img");lbImg.onerror=function(){if(!this.dataset.r){this.dataset.r="1";this.src=fastUrl(it.url);}};lbImg.dataset.r="";lbImg.src=it.url;document.getElementById("lb-txt").textContent=(curIdx+1)+"/"+l.length+" · "+(it.title||it.date||"");syncLbFav(it.url);var lnk=document.getElementById("lb-link");lnk.href=it.link||"#";lnk.style.display=it.link?"inline-block":"none";document.getElementById("lb").classList.add("show");}
document.getElementById("btnPrev").onclick=function(e){e.stopPropagation();curIdx--;showLb();};
document.getElementById("btnNext").onclick=function(e){e.stopPropagation();curIdx++;showLb();};
var lbEl=document.getElementById("lb");lbEl.onclick=function(e){if(e.target.id==="lb")closeLb();};
lbEl.addEventListener("touchstart",function(e){touchStartX=e.changedTouches.at(0).screenX;},{passive:true});
lbEl.addEventListener("touchend",function(e){var df=e.changedTouches.at(0).screenX-touchStartX;if(Math.abs(df)>45){if(df>0)curIdx--;else curIdx++;showLb();}},{passive:true});
document.addEventListener("keydown",function(e){if(!lbEl.classList.contains("show"))return;if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft"){curIdx--;showLb();}if(e.key==="ArrowRight"){curIdx++;showLb();}});
function getFiltered(){var q=(document.getElementById("kw").value||"").trim().toLowerCase();return DATA.filter(function(it){if(filterMode==="favs"&&!isFaved(it.url))return false;if(filterMode==="recent"&&recentDates.indexOf(it.date)===-1)return false;if(filterMode==="date"&&it.date!==curDate)return false;if(q&&((it.title||"").toLowerCase().indexOf(q)===-1&&(it.date||"").indexOf(q)===-1))return false;return true;});}
function appendBatch(){var l=window._curList||[],w=document.getElementById("wall"),end=Math.min(renderedCount+BATCH,l.length);for(var i=renderedCount;i<end;i++){(function(idx,it){var d=document.createElement("div");d.className="item";var fb=document.createElement("button");var on=isFaved(it.url);fb.className="fav-btn"+(on?" faved":"");fb.textContent=on?"❤️":"🤍";fb.onclick=function(e){e.stopPropagation();toggleFav(it.url);var n=isFaved(it.url);fb.className="fav-btn"+(n?" faved":"");fb.textContent=n?"❤️":"🤍";if(filterMode==="favs"&&!n)resetAndRender();};var img=document.createElement("img");img.loading=(idx<4?"eager":"lazy");img.decoding="async";if(idx<4)img.setAttribute("fetchpriority","high");img.referrerPolicy="no-referrer";img.src=fastUrl(it.url);img.onload=function(){d.classList.add("loaded");};img.onerror=function(){if(!this.dataset.retried){this.dataset.retried="1";this.src=it.url;}else{d.style.display="none";}};var ov=document.createElement("div");ov.className="overlay";var sp=document.createElement("span");sp.className="cap";sp.textContent=it.title||it.date||"";ov.appendChild(sp);d.appendChild(fb);d.appendChild(img);d.appendChild(ov);d.onclick=function(){openLb(idx);};w.appendChild(d);})(i,l[i]);}renderedCount=end;}
function resetAndRender(){window._curList=getFiltered();renderedCount=0;document.getElementById("wall").innerHTML="";appendBatch();}
function checkLoadMore(){var s=document.getElementById("sentinel");if(!s)return;if(s.getBoundingClientRect().top<=window.innerHeight+450&&renderedCount<(window._curList||[]).length){appendBatch();}}window.addEventListener("scroll",checkLoadMore,{passive:true});window.addEventListener("resize",checkLoadMore,{passive:true});setInterval(checkLoadMore,400);
initFilters();resetAndRender();
</script>
<style id="ltx-sort-style">#ltx-sort-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 16px 8px 16px;width:100%;}#ltx-sort-bar button{background:rgba(255,255,255,.07);color:#9ca3af;border:1px solid rgba(255,255,255,.14);padding:3px 11px;height:26px;border-radius:999px;font-size:12px;cursor:pointer;}#ltx-sort-bar button.active{background:#10b981;color:#fff;border-color:#10b981;font-weight:600;}</style>





<script id="ltx-sort-script">
window.addEventListener("load", function() {
  if (document.getElementById("ltx-sort-bar")) return;
  const dp = Array.from(document.querySelectorAll("button")).find(b => b.textContent && (b.textContent.includes("unknown date") || b.textContent.includes("全部")));
  if (!dp) return;
  const uPill = Array.from(document.querySelectorAll("button")).find(b => b.textContent && b.textContent.includes("unknown date"));
  if (uPill && uPill.parentElement) uPill.parentElement.appendChild(uPill);

  const bar = document.createElement("div");
  bar.id = "ltx-sort-bar";
  bar.innerHTML = '<button class="active" data-m="date-desc">日期(倒序)</button><button data-m="date-asc">日期(順序)</button><button data-m="name-asc">名字(A-Z)</button><button data-m="name-desc">名字(Z-A)</button><button data-m="code-asc">番號(A-Z)</button><button data-m="code-desc">番號(Z-A)</button><button id="ltxRnd" data-m="random">隨機</button>';
  if (dp.parentElement && dp.parentElement.parentElement) dp.parentElement.parentElement.appendChild(bar);
  else dp.parentElement.insertAdjacentElement("afterend", bar);

  const dEl = document.getElementById("gif-data");
  let fullData = [];
  try { fullData = JSON.parse(dEl.textContent || "[]"); } catch(e) {}
  fullData.forEach((it, i) => { it._oi = i; });

  const parseT = (t) => {
    let act = "", cd = ""; const d = t.indexOf("·");
    if (d >= 0) {
      const r = t.substring(d + 1).trim();
      const op = r.lastIndexOf("("), cp = r.lastIndexOf(")");
      if (op > 0 && cp > op) { act = r.substring(0, op).trim(); cd = r.substring(op + 1, cp).trim().toUpperCase(); }
      else { act = r; }
    }
    return { act: act, cd: cd };
  };

  bar.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", function() {
      bar.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const m = btn.dataset.m;
      const rnd = document.getElementById("ltxRnd");
      const wall = document.getElementById("wall");
      if (!wall) return;

      let nextList = [];
      if (m === "random") {
        let seen = new Set(JSON.parse(localStorage.getItem("ltx_native_deck_v9") || "[]"));
        let un = fullData.filter(it => !seen.has(it.url));
        if (un.length === 0) { seen.clear(); un = fullData.slice(); }
        for (let i = un.length - 1; i > 0; i--) {
          const b = new Uint32Array(1); window.crypto.getRandomValues(b);
          const j = b.at(0) % (i + 1);
          const tmp = un.at(i); un.splice(i, 1, un.at(j)); un.splice(j, 1, tmp);
        }
        nextList = un.slice(0, 16);
        nextList.forEach(it => seen.add(it.url));
        localStorage.setItem("ltx_native_deck_v9", JSON.stringify(Array.from(seen)));
        if (rnd) rnd.textContent = "隨機 (" + Math.max(0, un.length - nextList.length) + "/" + fullData.length + ")";
      } else {
        if (rnd) rnd.textContent = "隨機";
        nextList = fullData.slice().sort((ia, ib) => {
          const pa = parseT(String(ia.title || "")), pb = parseT(String(ib.title || ""));
          if (m === "date-desc") return (ib.date === "unknown date" ? "0000" : ib.date).localeCompare(ia.date === "unknown date" ? "0000" : ia.date) || ia._oi - ib._oi;
          if (m === "date-asc") return (ia.date === "unknown date" ? "0000" : ia.date).localeCompare(ib.date === "unknown date" ? "0000" : ib.date) || ib._oi - ia._oi;
          if (m === "name-asc" || m === "name-desc") { if (!pa.act && !pb.act) return ia._oi - ib._oi; if (!pa.act) return 1; if (!pb.act) return -1; const c = pa.act.localeCompare(pb.act, "ja"); return m === "name-asc" ? c : -c; }
          if (m === "code-asc" || m === "code-desc") { if (!pa.cd && !pb.cd) return ia._oi - ib._oi; if (!pa.cd) return 1; if (!pb.cd) return -1; const c = pa.cd.localeCompare(pb.cd, "en", { numeric: true }); return m === "code-asc" ? c : -c; }
          return ia._oi - ib._oi;
        });
      }

      wall.innerHTML = "";
      window.__curList = nextList;
      window._curList = nextList;
      if (typeof rendered !== "undefined") rendered = 0;
      if (typeof appendBatch === "function") appendBatch();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
});
</script>
